<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TempMail</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;min-height:100vh;color:#fff;background:radial-gradient(circle at 15% 10%,#8b35ff,#4b16a8 38%,#170d31 78%)}
.container{width:min(100%,520px);margin:auto;padding:22px 16px 35px}.logo{text-align:center;font-size:28px;font-weight:900}.logo span{color:#ff8a1f}.sub{text-align:center;color:#d8cbea;font-size:14px;margin:5px 0 22px}
.card{background:#ffffff18;border:1px solid #ffffff29;border-radius:24px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 18px 50px #0005;margin-bottom:15px}
label{display:block;font-size:13px;font-weight:700;color:#ddd2ef;margin:10px 2px 6px}.input{width:100%;border:1px solid #ffffff20;background:#120a27;color:#fff;border-radius:13px;padding:13px;font-size:15px;outline:none}.input:focus{border-color:#ff8a1f}
.emailbox{display:flex;gap:8px;background:#120a27;border-radius:15px;padding:7px}.email{flex:1;min-width:0;padding:12px 9px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:0;border-radius:13px;padding:12px 15px;color:#fff;font-weight:800;cursor:pointer}.copy{background:#ff861b}
.create{width:100%;margin-top:13px;font-size:16px;background:linear-gradient(135deg,#ff7a18,#ffae35)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.refresh{background:#7b35d9}.delete{background:#9e315e}
.timer{text-align:center;margin-top:15px;color:#ffd18f;font-weight:800}.status{text-align:center;color:#bfe7ff;font-size:13px;margin-top:7px}
.ad{min-height:82px;border:1px dashed #ffffff40;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#9f91b8;font-size:12px;margin-bottom:15px}
.inbox-title{display:flex;justify-content:space-between;align-items:center}.badge{background:#ff861b;padding:5px 9px;border-radius:99px;font-size:12px}.empty{text-align:center;padding:28px 10px;color:#c9bedc}.mail{background:#ffffff0d;border-radius:15px;padding:13px;margin-top:10px}.mail b{display:block}.mail small{color:#bfb2d2}
.login-card{display:none}.login-title{text-align:center;font-size:20px;font-weight:900}.linkbtn{background:none;color:#ffae35;padding:8px 0;width:100%}.footer{text-align:center;color:#9f91b8;font-size:11px;margin-top:18px}
@media(max-width:380px){.container{padding:18px 12px}.email{font-size:13px}}
</style>
</head>
<body>
<div class="container">
<div class="logo">Temp<span>Mail</span> ⚡</div>
<div class="sub">Email tạm thời — tạo, đăng nhập và quản lý Inbox trên điện thoại.</div>

<div class="card" id="createCard">
  <label>Email của bạn</label>
  <div class="emailbox"><div class="email" id="email">Chưa có email</div><button class="btn copy" onclick="copyEmail()">COPY</button></div>
  <label>Mật khẩu tự động</label>
  <div class="emailbox"><div class="email" id="passwordDisplay">••••••••••</div><button class="btn copy" onclick="copyPassword()">COPY</button></div>
  <button class="btn create" onclick="createEmail()">＋ CREATE EMAIL</button>
  <button class="btn linkbtn" onclick="showLogin()">🔐 Đã có email? LOGIN</button>
  <div class="timer" id="timer">10:00</div>
  <div class="status" id="status">Tạo email và đặt mật khẩu để bắt đầu.</div>
</div>

<div class="card login-card" id="loginCard">
  <div class="login-title">🔐 LOGIN</div>
  <label>Email</label><input class="input" id="loginEmail" type="email" placeholder="name@tempmail.example">
  <label>Mật khẩu</label><input class="input" id="loginPassword" type="password" placeholder="Mật khẩu">
  <button class="btn create" onclick="login()">LOGIN</button>
  <button class="btn linkbtn" onclick="showCreate()">← CREATE EMAIL</button>
  <div class="status" id="loginStatus"></div>
</div>

<div class="ad">ADVERTISEMENT</div>

<div class="card">
<div class="inbox-title"><strong>📥 INBOX</strong><span class="badge" id="count">0 thư</span></div>
<div id="inbox" class="empty">Đăng nhập hoặc tạo email để xem Inbox.</div>
</div>
<div class="footer">Temporary mailbox • Không dùng cho tài khoản quan trọng</div>
</div>

<script>
let address="",seconds=600,interval=null;

function randomString(n=9){const c="abcdefghijklmnopqrstuvwxyz0123456789";return Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join("")}
function createEmail(){
 const password=String(Math.floor(1000000000+Math.random()*9000000000));
 address=randomString()+"@tempmail.example";
 localStorage.setItem("temp_email",address);
 localStorage.setItem("temp_password",password);
 document.getElementById("email").textContent=address;
 document.getElementById("passwordDisplay").textContent=password;
 document.getElementById("loginEmail").value=address;
 document.getElementById("loginPassword").value="";
 seconds=600;clearInterval(interval);interval=setInterval(tick,1000);
 document.getElementById("status").textContent="✓ Đã tạo email + mật khẩu 10 số. Hãy lưu lại thông tin đăng nhập.";
 document.getElementById("inbox").innerHTML='<div class="empty">📭 Chưa nhận được thư.</div>';
 document.getElementById("count").textContent="0 thư";
}
function login(){
 const e=document.getElementById("loginEmail").value.trim(),p=document.getElementById("loginPassword").value;
 if(e===localStorage.getItem("temp_email")&&p===localStorage.getItem("temp_password")){
  address=e;seconds=600;clearInterval(interval);interval=setInterval(tick,1000);
  document.getElementById("loginStatus").textContent="✓ Đăng nhập thành công.";
  document.getElementById("email").textContent=address;
  document.getElementById("createCard").style.display="block";loadInbox();
 }else document.getElementById("loginStatus").textContent="❌ Email hoặc mật khẩu không đúng.";
}
function loadInbox(){document.getElementById("inbox").innerHTML='<div class="empty">📭 Chưa có thư.</div>'}
function showLogin(){document.getElementById("createCard").style.display="none";document.getElementById("loginCard").style.display="block"}
function showCreate(){document.getElementById("loginCard").style.display="none";document.getElementById("createCard").style.display="block"}
function copyEmail(){if(!address)return alert("Hãy tạo hoặc đăng nhập trước.");navigator.clipboard.writeText(address);document.getElementById("status").textContent="✓ Đã sao chép email."}
function copyPassword(){
 const p=localStorage.getItem("temp_password");
 if(!p)return alert("Hãy tạo email trước.");
 navigator.clipboard.writeText(p);
 document.getElementById("status").textContent="✓ Đã sao chép mật khẩu.";
}
function tick(){if(seconds<=0){clearInterval(interval);document.getElementById("timer").textContent="HẾT HẠN";return}seconds--;document.getElementById("timer").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}
function refreshInbox(){document.getElementById("status").textContent=address?"↻ Đang kiểm tra Inbox…":"Hãy đăng nhập trước."}
function deleteEmail(){localStorage.removeItem("temp_email");localStorage.removeItem("temp_password");address="";clearInterval(interval);document.getElementById("email").textContent="Chưa có email";document.getElementById("passwordDisplay").textContent="••••••••••";document.getElementById("timer").textContent="10:00";document.getElementById("status").textContent="Email đã được xóa khỏi thiết bị.";document.getElementById("inbox").innerHTML='<div class="empty">Đăng nhập hoặc tạo email để xem Inbox.</div>'}
</script>
</body>
</html>
